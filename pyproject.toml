[project]
name = "prism-handoff"
version = "0.1.0"
description = "Prism host diagnostics and synthetic runtime validation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "authlib>=1.8.0,<2",
    "fastapi>=0.141.1",
    "pydantic-ai-slim[openai]>=2.44.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
prism = "prism.cli:main"

[build-system]
requires = ["uv_build==0.11.29"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "prism"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ruff>=0.16.8",
]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/prism/**/*.py" }, { file = "src/prism/static/*" }]
