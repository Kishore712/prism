[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-shared-agent"
version = "0.1.0"
description = "Owner-hosted prototype for sharing an agent session through MCP"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Prism contributors" }]
dependencies = [
  "alembic>=1.14,<2",
  "mcp>=2.2,<3",
  "pydantic>=2,<3",
  "sqlalchemy>=2.0,<3",
  # Owner web UI (src/prism/webui): starlette + uvicorn are already pulled
  # in transitively by `mcp`, but are declared explicitly here since the UI
  # imports them directly. jinja2 and python-multipart are new, both small
  # and ubiquitous (form parsing and autoescaped HTML rendering).
  "starlette>=1.0",
  "uvicorn>=0.30",
  "jinja2>=3,<4",
  "python-multipart>=0.0.9",
]

[project.scripts]
prism = "prism.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
